name: Release Obsidian Plugin

on:
  push:
    tags:
      - "v*"
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build plugin
        run: |
          cd repo-v2
          npm install
          npm run build

      - name: Copy build artifacts to repo root
        run: |
          cp repo-v2/main.js main.js
          cp repo-v2/styles.css styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obsidian's community plugin directory requires the GitHub release tag to
          # match manifest.json's "version" field EXACTLY (no "v" prefix) -- it looks
          # for a release "tagged identically to the version inside manifest.json".
          # Deriving the release tag from manifest.json itself (rather than trusting
          # whatever git tag triggered this workflow) makes this correct regardless of
          # what tag naming convention gets pushed.
          version=$(node -p "require('./repo-v2/manifest.json').version")
          gh release create "$version" \
            --title "Release $version" \
            --generate-notes \
            main.js manifest.json styles.css
